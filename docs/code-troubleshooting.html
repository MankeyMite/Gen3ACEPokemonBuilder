    }

    }

    .doc-content {

      padding: 1.25rem;
      background: rgba(10, 20, 40, 0.45);
      box-shadow: inset 0 0 0 1px rgba(72, 213, 151, 0.08);

    }

    .doc-content h1 {

      color: var(--accent-glow);
      font-size: 1.65rem;
      border-bottom: 1px solid rgba(125, 211, 252, 0.25);
      padding-bottom: 0.3rem;
    }

    .doc-content h2 {
      font-size: 1.15rem;
      border-bottom: 1px solid rgba(125, 211, 252, 0.15);
      padding-bottom: 0.2rem;
      margin-top: 1.7rem;
    }

    .doc-content p {
      margin: 0.8rem 0;
      color: var(--fg);
      line-height: 1.72;
    }

    .doc-content ul {
      margin: 0.5rem 0 1.1rem 1.35rem;
      padding: 0;
    }

    .doc-content li {
      margin: 0.4rem 0;
      line-height: 1.62;
      color: var(--fg);
    }

    .doc-content .md-break {
      height: 0.55rem;
    }

    .doc-content a {
      color: var(--accent-glow);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .doc-content a:hover {
      color: #ffffff;
    }

    .doc-fallback {
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 0.9rem;
      color: #e2e8f0;
      background: rgba(2, 6, 23, 0.55);
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 8px;
      padding: 0.9rem;
    }
  </style>

  <header class="container">
    <h1>Base64 Code Troubleshooting</h1>
    <p class="muted">Guidance for issues while using generated Base64 box codes.</p>
  </header>

  <main class="container doc-wrap">
    <section class="card">
      <div class="doc-toolbar">
        <a href="../index.html">Back to Builder</a>
        <span id="statusText" class="doc-status">Loading troubleshooting guide...</span>
      </div>

      <section id="troubleshootContent" class="doc-content"></section>
    </section>
  </main>

  <script>
    const statusText = document.getElementById('statusText');
    const content = document.getElementById('troubleshootContent');

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function formatInline(text) {
      const safe = escapeHtml(text);
      return safe.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    }

    function markdownToHtml(mdText) {
      const lines = String(mdText || '').replace(/\r\n/g, '\n').split('\n');
      const out = [];
      let inList = false;
      let previousBlockType = '';

      const closeList = () => {
        if (inList) {
          out.push('</ul>');
          inList = false;
          previousBlockType = 'list';
        }
      };

      for (const rawLine of lines) {
        const line = rawLine.trim();

        if (!line) {
          closeList();
          if (out.length && previousBlockType !== 'break') {
            out.push('<div class="md-break" aria-hidden="true"></div>');
            previousBlockType = 'break';
          }
          continue;
        }

        if (/^<a\s+id=/.test(line)) {
          closeList();
          out.push(line);
          previousBlockType = 'anchor';
          continue;
        }

        if (/^#{1,6}\s+/.test(line)) {
          closeList();
          const level = Math.min(6, (line.match(/^#+/)[0] || '').length);
          const body = formatInline(line.replace(/^#{1,6}\s+/, ''));
          out.push('<h' + level + '>' + body + '</h' + level + '>');
          previousBlockType = 'heading';
          continue;
        }

        if (/^-\s+/.test(line)) {
          if (!inList) {
            out.push('<ul>');
            inList = true;
          }
          out.push('<li>' + formatInline(line.replace(/^-\s+/, '')) + '</li>');
          previousBlockType = 'list-item';
          continue;
        }

        closeList();
        out.push('<p>' + formatInline(line) + '</p>');
        previousBlockType = 'paragraph';
      }

      closeList();

      while (out.length && out[out.length - 1] === '<div class="md-break" aria-hidden="true"></div>') {
        out.pop();
      }

      return out.join('\n');
    }

    async function loadTroubleshooting() {
      try {
        const response = await fetch('./code-troubleshooting.md', { cache: 'no-store' });
        if (!response.ok) throw new Error('HTTP ' + response.status);

        const markdown = await response.text();
        content.innerHTML = markdownToHtml(markdown);
        statusText.textContent = 'Showing latest code-troubleshooting.md';
      } catch (error) {
        statusText.textContent = 'Could not load code-troubleshooting.md';
        content.innerHTML = '<div class="doc-fallback">' +
          'Failed to load the troubleshooting Markdown automatically.\n\n' +
          'Open this file directly:\n' +
          './code-troubleshooting.md' +
          '</div>';
      }
    }

    loadTroubleshooting();
  </script>
</body>
</html>
